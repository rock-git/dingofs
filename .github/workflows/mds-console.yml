name: MDS Console

on:
  pull_request:
    paths:
      - 'console/**'
      - 'src/mds/service/**'
      - 'test/unit/mds/service/**'
      - '.github/workflows/mds-console.yml'
  push:
    branches: [main]
    paths:
      - 'console/**'
      - 'src/mds/service/**'
      - 'test/unit/mds/service/**'
      - '.github/workflows/mds-console.yml'

jobs:
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts
      - name: Verify frontend and embedded asset contracts
        run: ./scripts/check-generated.sh
